<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                Catagram
            {% endblock %}
        </title>
        <link rel="icon" type="image/png" href="{% static 'images/Catagram C - logo.png' %}">
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
        <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
        <link rel="stylesheet" href="{% static 'css/home.css' %}">
    </head>
    <body>
        {% if user.is_authenticated %}
            <nav class="sidebar" aria-label="Sidebar principal">
                <div class="sidebar-brand">
                    <a href="{% url 'home:inicio' %}" aria-label="Inicio de Catagram">
                        <img class="sidebar-logo sidebar-logo--compact" src="{% static 'images/Catagram C - logo.png' %}" alt="">
                        <img class="sidebar-logo sidebar-logo--wordmark" src="/media/Catagram_logo.png" alt="">
                    </a>
                </div>

                <ul class="sidebar-nav" aria-label="Menú principal">
                    <li>
                        <a href="{% url 'home:inicio' %}" class="nav-item active" aria-current="page">
                            <span class="nav-icon" aria-hidden="true">🏠</span>
                            <span class="nav-text">Inicio</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item">
                            <span class="nav-icon" aria-hidden="true">🔎</span>
                            <span class="nav-text">Búsqueda</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item">
                            <span class="nav-icon" aria-hidden="true">📽️</span>
                            <span class="nav-text">Reels</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item">
                            <span class="nav-icon" aria-hidden="true">💬</span>
                            <span class="nav-text">Mensajes</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item">
                            <span class="nav-icon" aria-hidden="true">🔔</span>
                            <span class="nav-text">Notificaciones</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item">
                            <span class="nav-icon" aria-hidden="true">＋</span>
                            <span class="nav-text">Crear</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-item">
                            <span class="nav-icon" aria-hidden="true">🐈</span>
                            <span class="nav-text">Perfil</span>
                        </a>
                    </li>
                </ul>

                <div class="sidebar-footer">
                    <form method="POST" action="{% url 'logout' %}" class="sidebar-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-item nav-logout">
                            <span class="nav-icon" aria-hidden="true">🚪</span>
                            <span class="nav-text">Cerrar sesión</span>
                        </button>
                    </form>
                </div>

            </nav>
        {% endif %}

        <main class="{% if user.is_authenticated %}main-app{% else %}main-auth{% endif %}">
            {% block content %}
            {% endblock %}
        </main>
        {% block extra_scripts %}
        {% endblock %}
    </body>
</html>
